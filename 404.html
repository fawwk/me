<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAFAFA">
  <title>Page not found | Oche</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; background: #FAFAFA; color: #1A1A1A; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; text-align: center; }
    main { padding: 32px; }
    .sad-character { display: block; width: 112px; height: 98px; margin: 0 auto; }
    h1 { margin: 24px 0 16px; font-size: clamp(32px, 6vw, 56px); letter-spacing: -.03em; }
    p { margin: 0 0 24px; color: #6B6B6B; }
    a { color: inherit; text-underline-offset: 4px; }
    :focus-visible { outline: 2px solid #1A1A1A; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img class="sad-character" src="/assets/oche-sad.svg" alt="Oche looks sad, with a frown and a tear">
    <h1>Page not found.</h1>
    <p>Oche couldn’t find this page.</p>
    <a href="/">Return to Oche</a>
  </main>
</body>
</html>
